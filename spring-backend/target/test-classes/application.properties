server.port=0

spring.datasource.url=jdbc:h2:mem:amazonclone_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.sql.init.mode=never

jwt.secret=THIS_IS_A_TEST_JWT_SECRET_THAT_IS_32+_BYTES_LONG
jwt.expiration=3600000

razorpay.key-id=rzp_test_mock_key
razorpay.key-secret=rzp_test_mock_secret
