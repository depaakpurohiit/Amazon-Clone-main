# Server Configuration
server.port=8081

# Database Configuration
# Defaults to local file-based H2 so the app works without internet/Neon.
# Override with Postgres by setting DB_URL/DB_USERNAME/DB_PASSWORD/DB_DRIVER/DB_DIALECT env vars.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/amazonclone;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# JPA Configuration
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# Disable automatic SQL data file execution to prevent duplicate inserts.
# DataLoader.java handles seeding with an idempotent "missing" mode by default.
spring.sql.init.mode=never
# Defer running data.sql until after JPA has created/updated the schema (if needed)
spring.jpa.defer-datasource-initialization=true
# Ensure SQL files are read as UTF-8 to preserve currency symbols
spring.sql.init.encoding=UTF-8
spring.h2.console.enabled=false

# Product seeding (DataLoader)
# none | empty-only | missing
app.seed.products=${APP_SEED_PRODUCTS:missing}

# JWT Configuration
jwt.secret=${JWT_SECRET:CHANGE_ME_TO_A_32+_CHAR_RANDOM_JWT_SECRET_KEY_123456}
jwt.expiration=3600000

# Logging
logging.level.com.example=DEBUG
logging.level.org.springframework.security=DEBUG

# CORS Configuration
app.cors.allowed-origins=http://localhost:3000
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=true

# Razorpay Configuration (optional)
razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_mock_key}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:rzp_test_mock_secret}
