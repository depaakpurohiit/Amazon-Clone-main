# Server Configuration
server.port=8081

# Database Configuration
# Neon/PostgreSQL is the default runtime database when env vars are set. Falls back to H2 for local dev.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/amazonclone}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# JPA Configuration
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# Keep SQL init disabled for the seed data file; the lightweight SchemaMigrator handles the
# column additions needed by the newer role/seller entities.
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false
# Ensure SQL files are read as UTF-8 to preserve currency symbols
spring.sql.init.encoding=UTF-8
spring.h2.console.enabled=false

# Product seeding (DataLoader)
# none | empty-only | missing | replace
app.seed.products=${APP_SEED_PRODUCTS:none}

# JWT Configuration
jwt.secret=${JWT_SECRET:CHANGE_ME_TO_A_32+_CHAR_RANDOM_JWT_SECRET_KEY_123456}
jwt.expiration=3600000

# Logging
logging.level.com.example=DEBUG
logging.level.org.springframework.security=DEBUG

# CORS Configuration
app.cors.allowed-origins=http://localhost:3000
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=true

# Razorpay Configuration (optional)
razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_mock_key}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:rzp_test_mock_secret}

# Flyway (database migrations)
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration
# When connecting to an existing DB that may already have objects, baseline on migrate
spring.flyway.baseline-on-migrate=true

# Spring Boot Admin / Actuator Configuration
spring.boot.admin.context-path=/sba
spring.boot.admin.client.url=http://localhost:${server.port:8081}/sba
spring.boot.admin.client.username=mainadmin@@1212
spring.boot.admin.client.password=adminadmin@@

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
